name: Bug report
description: Something in the runtime does not do what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security bugs do not go here. Use the advisory form linked from the
        issue chooser, and read `SECURITY.md` for what counts as one.

        **Remove secrets before posting.** Record logs and reports contain
        every tool argument and result a Run touched, and `psych doctor`
        prints which environment variables are set. Redact API keys,
        credentials and customer data from anything you paste.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >
        A script or a failing test is worth more than a description, because it
        saves the round trip where we ask what you meant. Psych ships a
        scriptable fake model, so most bugs reproduce with no provider and no
        network.
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Output of `psych doctor` (redacted), or the package version, Python
        version and operating system. Say whether you installed from PyPI or
        from a checkout, and the commit if the latter.
      render: text
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Which store
      description: A bug that only appears on one adapter is a different bug.
      multiple: true
      options:
        - in-memory
        - PostgreSQL
        - MySQL
        - DynamoDB
        - does not involve the store
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Which model client
      options:
        - FakeModel
        - OpenAICompatibleClient against OpenAI
        - OpenAICompatibleClient against a gateway or proxy
        - my own ModelClient
        - does not involve the model
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Traceback or record log
      description: >
        Every question about a Run is a fold over its log, so the log usually
        answers the question. `psych_runtime.report()` output helps too.
        Redact secrets and customer data first.
      render: text
