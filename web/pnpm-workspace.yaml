packages:
  - "site"

# workerd is Cloudflare's runtime. `wrangler dev` runs the real thing locally,
# which is the only way a preview proves anything about the deployment, and it
# needs its postinstall to unpack the binary.
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - lucide-react@1.43.0

overrides:
  sharp: 0.35.4
